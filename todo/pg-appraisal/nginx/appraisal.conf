# Replace appraisal.pagegroup.example with your real hostname.
# TLS certs (fullchain.pem / privkey.pem) are mounted at /etc/letsencrypt — see DEPLOY.md.

server {
    listen 80;
    server_name appraisal.pagegroup.example;
    # ACME challenge for certbot (webroot mode), then redirect everything to HTTPS
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name appraisal.pagegroup.example;

    ssl_certificate     /etc/letsencrypt/live/appraisal.pagegroup.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/appraisal.pagegroup.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Security headers (tighten CSP once asset origins are confirmed)
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    client_max_body_size 6m;

    location / {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
