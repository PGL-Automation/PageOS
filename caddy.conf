# PageOS site blocks — imported by /opt/proxy/Caddyfile via:
#   import /opt/pageos/caddy.conf
# Caddy handles TLS automatically once DNS resolves pageos.org to this server.

www.pageos.org {
	redir https://pageos.org{uri} permanent
}

pageos.org {
	handle /api/* {
		reverse_proxy pageos-api-1:8080
	}
	handle {
		reverse_proxy pageos-web-1:3000
	}
}
