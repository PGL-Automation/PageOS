# Local development stack. The same service shape is reused for the Hostinger
# staging environment (see docs/onboarding-slice-plan.md §15); prod moves to
# AWS later with the app layer unchanged (MinIO -> S3, etc.).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pageos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pageos}
      POSTGRES_DB: ${POSTGRES_DB:-pageos}
    ports:
      # Host port 5433 to avoid colliding with other local Postgres instances.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pageos}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-pageos}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-pageos-dev-secret}
    ports:
      # Host ports 9002/9003 to avoid colliding with other local MinIO.
      - "9002:9000"
      - "9003:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PAGEOS_ENV: ${PAGEOS_ENV:-local}
      PAGEOS_HTTP_ADDR: ":8080"
      PAGEOS_LOG_LEVEL: ${PAGEOS_LOG_LEVEL:-debug}
      PAGEOS_DATABASE_URL: postgres://${POSTGRES_USER:-pageos}:${POSTGRES_PASSWORD:-pageos}@postgres:5432/${POSTGRES_DB:-pageos}?sslmode=disable
    ports:
      # Host port 8081 to avoid colliding with other local services on 8080.
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    environment:
      # Server-side (in-cluster) calls to the API:
      API_URL: http://api:8080
      # Browser calls to the API:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8081}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
