name: Deploy to Dev

on:
  push:
    branches: [develop]
  workflow_dispatch: {}

concurrency:
  group: deploy-dev
  cancel-in-progress: true   # cancel in-progress dev deploys when a new one arrives

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify dev secrets are set
        run: |
          missing=""
          [ -z "${{ secrets.DEV_VPS_HOST }}" ]        && missing="$missing DEV_VPS_HOST"
          [ -z "${{ secrets.DEV_VPS_SSH_KEY }}" ]      && missing="$missing DEV_VPS_SSH_KEY"
          [ -z "${{ secrets.DEV_VPS_KNOWN_HOSTS }}" ]  && missing="$missing DEV_VPS_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "ERROR: Missing GitHub secrets:$missing"
            echo "Add these in: Settings -> Secrets -> Actions"
            echo "  DEV_VPS_HOST        = IP or hostname of dev server"
            echo "  DEV_VPS_SSH_KEY     = SSH private key for dev server"
            echo "  DEV_VPS_KNOWN_HOSTS = ssh-keyscan <dev-host> output"
            exit 1
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEV_VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.DEV_VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync code to dev server
        run: |
          for i in $(seq 1 6); do
            rsync -az --delete \
              -e "ssh -o ConnectTimeout=15 -o ConnectionAttempts=1" \
              --exclude '.git' --exclude '.env' --exclude '.env.prod' \
              --exclude 'node_modules' --exclude '.next' --exclude 'bin' \
              ./ root@${{ secrets.DEV_VPS_HOST }}:/opt/pageos-dev/ && exit 0
            echo "rsync attempt $i failed; retrying in 15s..."; sleep 15
          done
          exit 1

      - name: Build and restart dev services
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
              root@${{ secrets.DEV_VPS_HOST }} \
              'set -e
               cd /opt/pageos-dev
               test -f .env || { echo "FATAL: /opt/pageos-dev/.env missing"; exit 1; }
               docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
               docker compose -f docker-compose.prod.yml ps'

      - name: Health check
        run: |
          sleep 8
          for i in $(seq 1 8); do
            if ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no \
              root@${{ secrets.DEV_VPS_HOST }} \
              'docker run --rm --network pageos-dev_default curlimages/curl:latest \
                -fsS --max-time 5 http://pageos-dev-api-1:8080/healthz' 2>/dev/null; then
              echo "Dev API healthy"
              exit 0
            fi
            echo "waiting for dev API (attempt $i)..."; sleep 10
          done
          echo "Dev API health check failed"
          exit 1
