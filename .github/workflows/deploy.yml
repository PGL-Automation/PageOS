name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify secrets are set
        run: |
          missing=""
          [ -z "${{ secrets.VPS_HOST }}" ]        && missing="$missing VPS_HOST"
          [ -z "${{ secrets.VPS_SSH_KEY }}" ]      && missing="$missing VPS_SSH_KEY"
          [ -z "${{ secrets.VPS_KNOWN_HOSTS }}" ]  && missing="$missing VPS_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "ERROR: Missing GitHub secrets:$missing"
            echo "Go to: Settings -> Secrets and variables -> Actions -> New repository secret"
            echo "  VPS_HOST        = 187.124.112.25"
            echo "  VPS_SSH_KEY     = contents of the private SSH key for root@187.124.112.25"
            echo "  VPS_KNOWN_HOSTS = output of: ssh-keyscan 187.124.112.25"
            exit 1
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync code to VPS
        run: |
          for i in $(seq 1 12); do
            rsync -az --delete \
              -e "ssh -o ConnectTimeout=15 -o ConnectionAttempts=1" \
              --exclude '.git' \
              --exclude '.env' \
              --exclude '.env.prod' \
              --exclude 'node_modules' \
              --exclude '.next' \
              --exclude 'bin' \
              ./ root@${{ secrets.VPS_HOST }}:/opt/pageos/ && exit 0
            echo "rsync attempt $i failed; retrying in 20s..."; sleep 20
          done
          exit 1

      - name: Build and restart services
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
              root@${{ secrets.VPS_HOST }} '
            set -e
            cd /opt/pageos
            test -f .env || {
              echo "FATAL: /opt/pageos/.env missing on server — see DEPLOY.md step 3"
              exit 1
            }
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            docker compose -f docker-compose.prod.yml ps
          '

      - name: Update Caddy config for pageos.org
        run: |
          for i in $(seq 1 8); do
            ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
                root@${{ secrets.VPS_HOST }} '
              set -e

              python3 - <<PYEOF
import re

with open("/opt/proxy/Caddyfile", "r") as f:
    content = f.read()

new_block = """
www.pageos.org {
\tredir https://pageos.org{uri} permanent
}

pageos.org {
\thandle /api/* {
\t\treverse_proxy pageos-api-1:8080
\t}
\thandle {
\t\treverse_proxy pageos-web-1:3000
\t}
}
"""

# Remove any existing pageos.org or app.pageos.org blocks (idempotent)
content = re.sub(r"app\.pageos\.org \{[^}]*\}\n?", "", content)
content = re.sub(r"(www\.)?pageos\.org \{[^}]*\}\n?", "", content)
content = content.rstrip() + "\n" + new_block

with open("/opt/proxy/Caddyfile", "w") as f:
    f.write(content)

print("Caddyfile updated")
PYEOF

              docker compose -f /opt/proxy/docker-compose.yml exec -T caddy \
                caddy reload --config /etc/caddy/Caddyfile
              echo "Caddy reloaded"
            ' && exit 0
            echo "Caddy config attempt $i failed, retrying in 15s..."; sleep 15
          done
          exit 1

      - name: Health check
        run: |
          for i in $(seq 1 15); do
            if curl -fsS --max-time 10 https://pageos.org/api/v1/healthz; then
              echo; echo "healthy"; exit 0
            fi
            echo "waiting for API (attempt $i)..."; sleep 15
          done
          echo "API did not become healthy in time"
          exit 1
