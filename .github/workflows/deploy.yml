name: Deploy to VPS

on:
  push:
    branches: [master]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Verify secrets are set
        run: |
          missing=""
          [ -z "${{ secrets.VPS_HOST }}" ]       && missing="$missing VPS_HOST"
          [ -z "${{ secrets.VPS_SSH_KEY }}" ]     && missing="$missing VPS_SSH_KEY"
          [ -z "${{ secrets.VPS_KNOWN_HOSTS }}" ] && missing="$missing VPS_KNOWN_HOSTS"
          if [ -n "$missing" ]; then
            echo "ERROR: Missing GitHub secrets:$missing"
            exit 1
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync code to VPS
        run: |
          for i in $(seq 1 12); do
            rsync -az --delete \
              -e "ssh -o ConnectTimeout=15 -o ConnectionAttempts=1" \
              --exclude '.git' \
              --exclude '.env' \
              --exclude '.env.prod' \
              --exclude 'node_modules' \
              --exclude '.next' \
              --exclude 'bin' \
              ./ root@${{ secrets.VPS_HOST }}:/opt/pageos/ && exit 0
            echo "rsync attempt $i failed; retrying in 20s..."; sleep 20
          done
          exit 1

      - name: Build and restart services
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 \
              root@${{ secrets.VPS_HOST }} \
              'set -e
               cd /opt/pageos
               test -f .env || { echo "FATAL: /opt/pageos/.env missing"; exit 1; }
               docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
               docker compose -f docker-compose.prod.yml ps'

      - name: Update Caddy config for pageos.org
        run: |
          for i in $(seq 1 8); do
            ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=8 \
                root@${{ secrets.VPS_HOST }} \
                'set -e
                 python3 /opt/pageos/scripts/update_caddy.py
                 docker compose -f /opt/proxy/docker-compose.yml exec -T caddy \
                   caddy reload --config /etc/caddy/Caddyfile
                 echo "Caddy reloaded"' \
                && exit 0
            echo "Caddy update attempt $i failed, retrying in 15s..."; sleep 15
          done
          exit 1

      - name: Health check
        run: |
          # Give containers a moment to finish starting up
          sleep 8
          # Check API health via Docker network (works before DNS is configured)
          # healthz is at /healthz (not /api/v1/healthz) on the API container
          for i in $(seq 1 10); do
            if ssh -o ConnectTimeout=10 -o StrictHostKeyChecking=no \
              root@${{ secrets.VPS_HOST }} \
              'docker run --rm --network pageos_default curlimages/curl:latest \
                -fsS --max-time 5 http://pageos-api-1:8080/healthz' 2>/dev/null; then
              echo "API healthy"
              echo "NOTE: Visit https://pageos.org once DNS A records pageos.org -> ${{ secrets.VPS_HOST }} are configured"
              exit 0
            fi
            echo "waiting for API (attempt $i)..."; sleep 10
          done
          echo "API health check failed"
          exit 1
